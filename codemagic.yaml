workflows:
  android-debug:
    name: Android Debug APK
    max_build_duration: 30
    environment:
      java: 21
    scripts:
      - name: Set permissions on Gradle wrapper
        script: chmod +x gradlew
      - name: Build Debug APK
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
